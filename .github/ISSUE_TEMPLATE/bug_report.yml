name: Bug report
description: Report a reproducible problem in a skill, script, registry entry, or public document.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a reproducible problem. Do not include credentials, private user data, client information, or sensitive logs.
  - type: input
    id: affected-path
    attributes:
      label: Affected path
      description: Provide the skill, script, document, or registry path.
      placeholder: skills/workflow-skills/systematic-debugging/SKILL.md
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release or commit
      description: Which release tag or commit are you using?
      placeholder: v1.0.0 or 5996f296
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Ask the agent to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and validation
      description: Include relevant OS, Manus environment, external-service assumptions, and checks already run. Exclude secrets.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Safety checklist
      options:
        - label: I removed credentials, private data, and sensitive logs.
          required: true
        - label: I searched existing issues and documentation first.
          required: true
